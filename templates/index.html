<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATA CREATION - Premium Creative Agency</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#222}
header{text-align:center;padding:30px;background:#000;color:#fff}
header h1{margin:0;letter-spacing:3px}
header p{color:#d4af37;margin-top:8px}
.filters{text-align:center;margin:30px 0}
.filters button{margin:5px;padding:10px 18px;border:1px solid #000;background:#fff;cursor:pointer;border-radius:20px}
.filters button.active{background:#000;color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:20px}
.gallery .item{overflow:hidden;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.gallery .item img{width:100%;height:280px;object-fit:cover;transition:0.3s}
.gallery .item img:hover{transform:scale(1.05)}
.contact{text-align:center;padding:40px;background:#f9f9f9}
.btn{display:inline-block;padding:12px 25px;background:#25D366;color:#fff;text-decoration:none;border-radius:30px;margin-top:15px}
</style>
</head>
<body>

<header>
  <h1>LATA CREATION</h1>
  <p>Premium Creative Agency</p>
</header>

<div class="filters">
  <button class="active" onclick="filterGallery('all',this)">All</button>
  <button onclick="filterGallery('wedding',this)">Wedding</button>
  <button onclick="filterGallery('haldi',this)">Haldi</button>
  <button onclick="filterGallery('reception',this)">Reception</button>
  <button onclick="filterGallery('engagement',this)">Engagement</button>
  <button onclick="filterGallery('birthday',this)">Birthday</button>
</div>

<div class="gallery" id="gallery">
  <div class="item" data-category="wedding"><img src="/static/images/wedding/w1.jpg"></div>
  <div class="item" data-category="wedding"><img src="/static/images/wedding/w2.jpg"></div>
  <div class="item" data-category="haldi"><img src="/static/images/haldi/h1.jpg"></div>
  <div class="item" data-category="haldi"><img src="/static/images/haldi/h2.jpg"></div>
  <div class="item" data-category="reception"><img src="/static/images/reception/r1.jpg"></div>
  <div class="item" data-category="engagement"><img src="/static/images/engagement/e1.jpg"></div>
  <div class="item" data-category="birthday"><img src="/static/images/birthday/b1.jpg"></div>
</div>

<div class="contact">
  <h2>Booking Sathi Contact Kara Sir</h2>
  <a class="btn" href="https://wa.me/91XXXXXXXXXX?text=Hi%20Lata%20Creation%20Booking%20Sathi">WhatsApp Vara Message Kara</a>
</div>

<script>
function filterGallery(category, btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.gallery .item').forEach(item=>{
    if(category==='all' || item.dataset.category===category){
      item.style.display='block';
    } else {
      item.style.display='none';
    }
  });
}
</script>

</body>
</html>
